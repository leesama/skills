interface:
  display_name: "飞书文档云效"
  short_description: "读取飞书文档，按需拆云效任务"
  default_prompt: "Use $feishu-docs-yunxiao whenever the user provides a Feishu Wiki/doc URL. If the user only asks to read, check, summarize, or extract the doc, fetch the doc and answer without creating task plans. If the user asks to split or create tasks, read the doc, split Yunxiao task plans by configured project role, present three options for confirmation, then create workitems only after approval."
